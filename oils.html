<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>روغن‌ها | اتوسرویس هاشمی</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Vazirmatn,sans-serif}
    body{background:#121212;color:#fff}
    header{background:#1a1a1a;border-bottom:3px solid #ffcc00;padding:20px;text-align:center}
    header h1{color:#ffcc00}
    .container{max-width:1100px;margin:40px auto;padding:0 20px}
    .title{text-align:center;margin-bottom:25px}
    .title h2{color:#ffcc00;margin-bottom:8px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
    .card{background:#1a1a1a;border:1px solid #333;border-radius:12px;overflow:hidden;text-decoration:none;color:#fff;transition:.3s}
    .card:hover{transform:translateY(-6px);border-color:#ffcc00}
    .card img{width:100%;height:220px;object-fit:cover;display:block}
    .info{padding:16px}
    .info h3{color:#ffcc00;margin-bottom:8px}
    .info p{color:#bbb;font-size:14px}
    .btn{display:inline-block;margin-top:12px;background:#ffcc00;color:#000;padding:8px 14px;border-radius:6px;font-size:13px;font-weight:700}
    .back{display:block;width:max-content;margin:30px auto 0;background:#333;color:#fff;text-decoration:none;padding:10px 18px;border-radius:6px}
  </style>
</head>
<body>
  <header>
    <h1>اتوسرویس هاشمی</h1>
    <p>دسته‌بندی روغن‌ها</p>
  </header>

  <main class="container">
    <div class="title">
      <h2>روغن‌ها</h2>
      <p>برای مشاهده محصول، روی کارت کلیک کن</p>
    </div>

    <div class="grid">
      <a class="card" href="oil-behranp10w40.html">
        <img src="images/superp10w40.jpg" alt="بهران سوپر پیشتاز">
        <div class="info">
          <h3>بهران سوپر پیشتاز 10W-40</h3>
          <a href="oil-behranp10w40.html">نمایش محصول</a>
          <p>مناسب خودروهای سواری داخلی</p>
          <span class="btn">مشاهده محصول</span>
        </div>
      </a>

      <a class="card" href="oil-taktaz.html">
        <img src="images/taktaz.jpg" alt="بهران تکتاز">
        <div class="info">
          <h3>بهران تکتاز 20W-50</h3>
          <p>مناسب خودروهای کارکرده و قدیمی</p>
          <span class="btn">مشاهده محصول</span>
        </div>
      </a>
    </div>

    <a class="back" href="index.html">بازگشت</a>
  </main>
</body>
</html>
